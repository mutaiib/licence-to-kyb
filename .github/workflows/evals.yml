# The eval report (US6, T096; FR-034). Not part of the pull-request gate: a live run calls a
# paid model API. It runs by hand, and on release branches before a release.
#   - model "scripted": answers from labels; checks routing and rules; no secret, no cost.
#   - model "profile": the Claude models of the default profile; needs ANTHROPIC_API_KEY in
#     the "evals" environment, which can require an approval before the job starts.
name: evals

on:
  workflow_dispatch:
    inputs:
      model:
        description: "scripted (no cost) or profile (calls the model API)"
        type: choice
        options: [scripted, profile]
        default: scripted
      resolver:
        description: "Run the resolver"
        type: boolean
        default: true
  push:
    branches: ["release/**"]

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: eval report
    runs-on: ubuntu-24.04
    environment: evals
    timeout-minutes: 120
    env:
      # A push to a release branch has no inputs: it runs the scripted model (free), with the
      # resolver on. Only a manual run can choose the paid profile or turn the resolver off.
      # (On a push, inputs.resolver is null, and null == false is true in an expression, so
      # the event name must be checked too.)
      MODEL: ${{ inputs.model || 'scripted' }}
      RESOLVER_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.resolver == false) && '--no-resolver' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install system packages for OCR and the licence renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ara fonts-noto-core
      - name: Install dependencies from the lock file
        working-directory: backend
        run: uv sync --frozen
      - name: Fetch the pinned OCR language data
        run: scripts/fetch_tessdata.sh && echo "TESSDATA_PREFIX=$PWD/var/tessdata" >> "$GITHUB_ENV"
      - name: Render the synthetic licences from their seeds
        run: uv --project backend run python scripts/gen_licences.py
      - name: Run the eval
        env:
          # Read only by the "profile" model; the scripted run never sees a key.
          ANTHROPIC_API_KEY: ${{ env.MODEL == 'profile' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          uv --project backend run python -m evals.run --model "$MODEL" $RESOLVER_FLAG --name "ci-${{ github.run_id }}"
          uv --project backend run python -m evals.compare evals/reports/baseline.json "evals/reports/ci-${{ github.run_id }}/report.json"
      - name: Fail when cases errored or none ran
        # A case that raised, or a run with no cases (missing documents), must not pass.
        run: |
          report="evals/reports/ci-${{ github.run_id }}/report.json"
          errors=$(jq '.summary.errors' "$report")
          cases=$(jq '.summary.cases' "$report")
          echo "cases: $cases, errors: $errors"
          test "$cases" -gt 0 || { echo "no case ran" >&2; exit 1; }
          test "$errors" -eq 0 || { echo "$errors cases errored" >&2; exit 1; }
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report-${{ github.run_id }}
          path: evals/reports/ci-${{ github.run_id }}/
          retention-days: 30
