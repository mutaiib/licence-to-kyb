[project]
name = "licence-kyb"
version = "0.0.0"
description = "Trade licence to KYB onboarding: an agentic document workflow with strict schemas, validation rules, calibrated confidence and human review."
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "pydantic>=2.9",
  "pydantic-settings",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pypdfium2",
  "pdfplumber",
  "pytesseract",
  "opencv-python-headless",
  "pillow",
  "rapidfuzz",
  "cryptography",
  "pyyaml",
  "argon2-cffi",
  "python-json-logger",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "hypothesis",
  "httpx",
  "ruff",
  "mypy",
  "types-PyYAML",
  "pip-audit",
  "pre-commit",
]
data = [
  "reportlab",
  "arabic-reshaper",
  "python-bidi",
  "qrcode",
  "faker",
  "types-reportlab",
  "types-qrcode",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/licence_kyb"]

[tool.uv]
default-groups = ["dev", "data"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["licence_kyb"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "pypdfium2.*", "pdfplumber.*", "rapidfuzz.*", "langgraph.*", "pythonjsonlogger.*", "arabic_reshaper.*", "bidi.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls the paid model API; never runs in CI",
]

[tool.coverage.run]
source = ["licence_kyb"]
branch = true
