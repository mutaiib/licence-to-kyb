[project]
name = "licence-kyb"
version = "0.0.0"
description = "Trade licence to KYB onboarding: an agentic document workflow with strict schemas, validation rules, calibrated confidence and human review."
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "pydantic>=2.9",
  "pydantic-settings",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pypdfium2",
  "pdfplumber",
  "pytesseract",
  "opencv-python-headless",
  "pillow",
  "rapidfuzz",
  "cryptography",
  "pyyaml",
  "argon2-cffi",
  "python-json-logger",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "hypothesis",
  "httpx",
  "ruff",
  "mypy",
  "types-PyYAML",
  "pip-audit",
]
data = [
  "reportlab",
  "arabic-reshaper",
  "python-bidi",
  "qrcode",
  "faker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/licence_kyb"]

[tool.uv]
default-groups = ["dev", "data"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "../scripts", "../evals"]

[tool.ruff.lint]
select = [
  "F",    # pyflakes
  "E", "W",  # pycodestyle
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "S",    # bandit-style security rules
  "C90",  # complexity
  "N",    # naming
  "RUF",
  "PT",   # pytest style
  "PL",   # pylint subset
]
ignore = [
  "PLR0913",  # many arguments: typed request objects are preferred, reviewed case by case
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"../evals/tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["licence_kyb"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "pypdfium2.*", "pdfplumber.*", "cv2.*", "rapidfuzz.*", "langgraph.*", "pythonjsonlogger.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls the paid model API; never runs in CI",
]

[tool.coverage.run]
source = ["licence_kyb"]
branch = true
