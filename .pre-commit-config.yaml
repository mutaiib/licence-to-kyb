# Install: uv --project backend run pre-commit install --hook-type pre-commit --hook-type commit-msg
# Vendored Spec Kit files stay byte-identical to upstream.
exclude: ^(\.specify/(scripts|templates|extensions|workflows|integrations)|\.claude/skills)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (backend)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        pass_filenames: false
        files: ^backend/src/
      - id: conventional-commit
        name: Conventional Commit message
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
