server_tokens off;

server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:8000;
    client_max_body_size 11m;
    # The reviewer's own address, not nginx's: the sign-in rate limit counts it. Set, never
    # appended, so a client cannot add addresses of its own.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri /index.html; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
